# Stack de monitoramento: Prometheus (métricas), Loki + Alloy (logs) e Grafana (telas).
# O serviço BentoML roda FORA do Docker, na máquina, na porta 3000.
# Uso: docker compose -f monitoring/stack/docker-compose.yml up -d
name: monitoramento-medidor

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # por quanto tempo o TSDB guarda as séries
      - --web.enable-admin-api              # permite snapshot do banco (ver README)
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dados:/prometheus        # o banco do Prometheus sobrevive a restart
    extra_hosts: ["host.docker.internal:host-gateway"]  # Linux; no Docker Desktop já existe

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]
    volumes:
      - loki_dados:/loki

  alloy:
    # Lê logs/requisicoes.jsonl e envia cada linha nova ao Loki.
    image: grafana/alloy:v1.10.0
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ../../logs:/logs:ro
      - alloy_dados:/var/lib/alloy          # guarda até onde já leu o arquivo
    depends_on: [loki]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [prometheus, loki]

volumes:
  prometheus_dados:
  loki_dados:
  alloy_dados:
